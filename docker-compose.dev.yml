services:
  # Note: Frontend is not included in dev compose file.
  # Run frontend separately with 'npm start' for better hot-reload performance.
  
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: siminho-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siminho_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - siminho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Development with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: siminho-backend-dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: siminho_dev
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:4200
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - siminho-network
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local

networks:
  siminho-network:
    driver: bridge
