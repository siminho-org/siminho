# Default values for siminho
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: production

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  service:
    name: postgres-service
    port: 5432
  auth:
    username: postgres
    password: postgres
    database: siminho_prod
  persistence:
    enabled: true
    size: 10Gi
    storageClass: gp2  # AWS EBS storage class
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Backend configuration
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: siminho-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: backend-service
    type: ClusterIP
    port: 3000
    targetPort: 3000
  env:
    DB_HOST: postgres-service
    DB_PORT: "5432"
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    DB_DATABASE: siminho_prod
    PORT: "3000"
    NODE_ENV: production
    FRONTEND_URL: "*"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: siminho-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: frontend-service
    type: LoadBalancer  # Use LoadBalancer for AWS ELB
    port: 80
    targetPort: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5

# Ingress configuration (optional - for when domain is set up)
ingress:
  enabled: false
  className: "alb"  # AWS ALB Ingress Controller
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: siminho.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
