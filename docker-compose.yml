services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: siminho-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siminho_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - siminho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siminho-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: siminho_dev
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - siminho-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siminho-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - siminho-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  siminho-network:
    driver: bridge
